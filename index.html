<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>말문일본어 · 말이 시작되는 여행</title>
<meta name="description" content="한국어 구조로 이해하고 한글 발음으로 말하는 일본어. 조사 18개, 동사 변신, 여행 회화를 직접 연습하세요."/>
<meta name="theme-color" content="#f6f5f0"/>
<style>
:root{
  --bg:#FBF6EC; --card:#FFFDF6; --ink:#22303F; --sub:#7E8693;
  --gold:#C9952C; --gold-bg:#F8EFD8; --coral:#E2674A; --coral-bg:#FBE7E0;
  --pink:#D96A8B; --green:#3E8E5A; --green-bg:#E2F0E6; --red:#C4453A; --red-bg:#F8E2DE;
  --blue:#3E6E8E; --blue-bg:#E2EDF4; --line:#E8DFC9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.6; min-height:100vh;
  background-image:radial-gradient(#EFE6D2 1px, transparent 1px); background-size:22px 22px;
}
#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
/* ── 상단바 ── */
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:12px 16px 10px; background:linear-gradient(180deg,#FBF6EC 75%,rgba(251,246,236,0));
}
#titlebox{flex:1; min-width:0;}
.eyebrow{font-size:10.5px; font-weight:800; letter-spacing:.08em; color:var(--gold);}
#apptitle{margin:0; font-size:19px; font-weight:900; letter-spacing:-.01em;}
.iconbtn{
  flex:none; width:40px; height:40px; border-radius:14px; border:1.5px solid var(--line);
  background:var(--card); font-size:18px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 2px 0 rgba(34,48,63,.06);
}
.iconbtn.on{border-color:var(--gold); background:var(--gold-bg);}
/* ── 진행 바 ── */
#progressline{padding:0 16px; display:none;}
#progressbar{height:8px; border-radius:99px; background:#EFE6D2; overflow:hidden; border:1px solid var(--line);}
#progressfill{height:100%; width:0%; background:linear-gradient(90deg,var(--gold),#E2B344); border-radius:99px; transition:width .35s ease;}
#chlabel{display:flex; align-items:center; padding:6px 16px 0; font-size:11px; font-weight:800; color:var(--sub);}
#chlabeltxt{flex:1;}
#prevbtn{font-size:11px; font-weight:800; color:var(--blue); background:none; border:none; padding:2px 0 2px 12px; font-family:inherit; cursor:pointer;}
/* ── 무대 ── */
#stage{flex:1; display:flex; flex-direction:column; gap:12px; padding:12px 16px 28px;}
.card{
  background:var(--card); border:1.5px solid var(--line); border-radius:18px;
  padding:16px; box-shadow:0 3px 0 rgba(34,48,63,.05);
}
.card .h{font-size:16.5px; font-weight:900; margin:2px 0 6px; letter-spacing:-.01em;}
.card .body{font-size:13px; font-weight:600; color:#3C4654; line-height:1.75;}
.card .body b{color:var(--ink);}
.eyebrow.gold-t{color:var(--gold);} .eyebrow.coral-t{color:var(--coral);} .eyebrow.green-t{color:var(--green);} .eyebrow.blue-t{color:var(--blue);}
.caption{font-size:11px; font-weight:700; color:var(--sub); line-height:1.6; padding:0 4px;}
/* ── 버튼 ── */
.btnrow{display:flex; flex-direction:column; gap:8px;}
.btn{
  width:100%; border:none; border-radius:16px; padding:14px 16px; font-size:14.5px; font-weight:900;
  font-family:inherit; cursor:pointer; letter-spacing:-.01em; box-shadow:0 3px 0 rgba(34,48,63,.12);
  transition:transform .06s ease;
}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(34,48,63,.12);}
.btn.primary{background:var(--blue); color:#fff;}
.btn.gold{background:linear-gradient(135deg,#D9A532,#C9952C); color:#fff;}
.btn.coral{background:var(--coral); color:#fff;}
.btn.green{background:var(--green); color:#fff;}
.btn.ghost{background:var(--card); color:var(--ink); border:1.5px solid var(--line); box-shadow:0 2px 0 rgba(34,48,63,.06);}
.btn.sm{padding:10px 12px; font-size:13px; border-radius:13px;}
.btn:disabled{opacity:.4; pointer-events:none;}
/* ── 퀴즈 선택지 ── */
.opt{
  width:100%; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:15px;
  padding:13px 14px; font-size:14px; font-weight:800; font-family:inherit; cursor:pointer;
  box-shadow:0 2px 0 rgba(34,48,63,.06); line-height:1.5;
}
.opt.right{border-color:var(--green); background:var(--green-bg);}
.opt.wrong{border-color:var(--red); background:var(--red-bg);}
.feedback{border-radius:14px; padding:12px 14px; font-size:13px; font-weight:700; line-height:1.7;}
.feedback.good{background:var(--green-bg); border:1.5px solid var(--green); color:#27503A;}
.feedback.bad{background:var(--red-bg); border:1.5px solid var(--red); color:#7A2D26;}
/* ── 말문 칩 / 변신 위젯 ── */
.bigword{font-size:26px; font-weight:900; letter-spacing:-.01em; line-height:1.3;}
.bigword .stem{color:var(--coral);} .bigword .tail{color:var(--blue);}
.meanline{font-size:14px; font-weight:800; color:var(--green); margin-top:2px;}
.formula{font-size:11.5px; font-weight:800; color:var(--sub); margin-top:6px;}
.chips{display:flex; flex-wrap:wrap; gap:7px;}
.chip{
  border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:8px 13px;
  font-size:13px; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:0 2px 0 rgba(34,48,63,.06);
}
.chip.sel{border-color:var(--coral); background:var(--coral-bg); color:#8A3A28;}
.chip.tailchip.sel{border-color:var(--blue); background:var(--blue-bg); color:#27465A;}
/* ── 문장 카드 ── */
.phrase{
  display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line);
  border-radius:15px; padding:12px 13px; cursor:pointer; box-shadow:0 2px 0 rgba(34,48,63,.06);
}
.phrase .jp{font-size:15.5px; font-weight:900;}
.phrase .kr{font-size:12px; font-weight:700; color:var(--sub);}
.phrase .spk{flex:none; font-size:16px;}
/* ── 배열 퀴즈 ── */
.slotline{min-height:48px; display:flex; flex-wrap:wrap; gap:7px; padding:10px; border:1.5px dashed var(--gold); border-radius:14px; background:var(--gold-bg);}
.slotline:empty::before{content:"여기에 순서대로 눌러 담아요"; font-size:12px; font-weight:700; color:var(--sub);}
/* ── 표 ── */
.tbl{width:100%; border-collapse:collapse; font-size:13px;}
.tbl td{padding:8px 6px; border-bottom:1px dashed var(--line); font-weight:700;}
.tbl td:first-child{font-weight:900; color:var(--coral); white-space:nowrap;}
.tbl td:last-child{color:var(--sub); font-size:12px;}
/* ── 홈 코스 ── */
.course{display:flex; align-items:center; gap:12px; background:var(--card); border:1.5px solid var(--line); border-radius:17px; padding:13px 14px; cursor:pointer; box-shadow:0 3px 0 rgba(34,48,63,.05);}
.course .ic{font-size:26px; flex:none; width:40px; text-align:center;}
.course .t{font-size:14.5px; font-weight:900;}
.course .d{font-size:11.5px; font-weight:700; color:var(--sub); line-height:1.5;}
.course .done{flex:none; font-size:18px;}
/* ── 시뮬레이션 ── */
.dialog{display:flex; gap:10px; align-items:flex-start;}
.portrait{flex:none; width:52px; height:52px; border-radius:16px; background:var(--card); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 2px 0 rgba(34,48,63,.06);}
.bubble{flex:1; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:11px 13px;}
.bubble .who{font-size:10.5px; font-weight:800; color:var(--gold); margin-bottom:3px;}
.bubble .txt{font-size:13.5px; font-weight:700; line-height:1.65;}
.simhead{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:800; color:var(--sub);}
.stamp{display:inline-block; border:3px solid var(--green); color:var(--green); border-radius:12px; padding:6px 14px; font-size:18px; font-weight:900; transform:rotate(-6deg); letter-spacing:.05em;}
/* ── 애니메이션 ── */
.fade-up{animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.pop-in{animation:popIn .35s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes popIn{from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);}}
.shake{animation:shake .5s ease;}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
footer{padding:14px 18px 26px;}
footer p{margin:0; font-size:10px; font-weight:600; color:#9AA3AE; line-height:1.65;}

.iconbtn.on{background:var(--coral); color:#fff;}
.spk{font-size:15px; opacity:.6; flex-shrink:0;}
.phrase{cursor:pointer;}
.tbl tr.say:hover td{background:var(--gold-bg);}
.course.locked{opacity:.5;}
.course.locked .ic{filter:grayscale(1);}
.drillword{font-size:23px; font-weight:900; letter-spacing:.5px;}
.drillword .rufly{display:inline-block; color:var(--red); animation:ruFly 1.3s ease-in forwards;}
@keyframes ruFly{0%{opacity:1; transform:none;} 100%{opacity:0; transform:translateY(-22px) rotate(28deg);}}
.drillword .tailpop{display:inline-block; color:var(--coral); animation:tailPop .5s 1.05s both;}
@keyframes tailPop{from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:none;}}

/* ═══════════════ PREMIUM REFINEMENT LAYER (override) ═══════════════ */
/* Same token NAMES so all logic-applied classes keep working — values only, retuned. */
:root{
  --bg:#F4F2EC;            /* warm porcelain — off the yellow cream */
  --card:#FCFBF7;          /* crisp warm white */
  --ink:#23272E;           /* deep warm ink */
  --sub:#8C9099;           /* quiet grey */
  --gold:#A9842F; --gold-bg:#F2EAD5;       /* antique leaf gold */
  --coral:#C2573F; --coral-bg:#F5E3DC;     /* 朱 brick-vermilion */
  --pink:#C16A82;
  --green:#357552; --green-bg:#E3EDE6;     /* sage */
  --red:#B5453B; --red-bg:#F3E1DD;
  --blue:#33425E; --blue-bg:#E6E9F0;       /* 藍 indigo */
  --line:#E7E2D6;          /* soft warm hairline */
  --shadow-sm:0 1px 2px rgba(35,39,46,.05), 0 3px 10px -4px rgba(35,39,46,.10);
  --shadow-md:0 1px 2px rgba(35,39,46,.05), 0 14px 32px -18px rgba(35,39,46,.22);
}
body{
  background:radial-gradient(125% 70% at 50% -5%, #FBF9F3 0%, #F4F2EC 58%) fixed, var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* Wordmark in a refined serif — the one signature type move */
.eyebrow{ letter-spacing:.16em; font-size:10px; opacity:.95; }
#apptitle{ font-family:"Gowun Batang", serif; font-weight:700; font-size:22px; letter-spacing:0; line-height:1.15; margin-top:1px; }
.card .h{ letter-spacing:-.015em; color:var(--ink); }
.bigword{ letter-spacing:-.02em; }
.drillword{ letter-spacing:0; }
/* Soft, layered shadows replace the flat offset (0 3px 0) look — the biggest premium signal */
#stage{ gap:14px; padding:14px 16px 34px; }
.card{ border:1px solid var(--line); border-radius:20px; padding:18px 17px; box-shadow:var(--shadow-md); }
.btn{ border-radius:15px; box-shadow:var(--shadow-sm); letter-spacing:-.01em; }
.btn:active{ transform:translateY(1px); box-shadow:0 1px 3px rgba(35,39,46,.12); }
.btn.gold{ background:linear-gradient(135deg,#BE9540,#A0792B); }
.btn.ghost{ border:1px solid var(--line); box-shadow:var(--shadow-sm); }
.opt,.chip,.phrase,.course,.portrait,.bubble{ box-shadow:var(--shadow-sm); }
.opt{ border:1px solid var(--line); border-radius:15px; }
.opt:active{ transform:translateY(1px); }
.chip{ border:1px solid var(--line); }
.phrase,.course,.bubble{ border:1px solid var(--line); }
.iconbtn{ border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow-sm); }
.iconbtn.on{ background:var(--coral); color:#fff; border-color:var(--coral); }
.feedback{ border-radius:15px; }
#progressbar{ border:1px solid var(--line); background:#ECE5D6; }
#progressfill{ background:linear-gradient(90deg,var(--gold),#CBA655); }
#topbar{ background:linear-gradient(180deg,#F4F2EC 68%, rgba(244,242,236,0)); }
.slotline{ border:1.5px dashed var(--gold); border-radius:16px; }
.stamp{ border-color:var(--coral); color:var(--coral); }
.drillword .rufly{ color:var(--coral); }
.drillword .tailpop{ color:var(--blue); }
/* Quality floor */
:focus-visible{ outline:2.5px solid var(--blue); outline-offset:2px; border-radius:9px; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
/* ── 관문 타이머 ── */
.timerbar{ height:7px; border-radius:99px; background:#ECE5D6; border:1px solid var(--line); overflow:hidden; margin:9px 0 3px; }
.timerfill{ height:100%; width:100%; border-radius:99px; background:linear-gradient(90deg,var(--green),#62B187); transition:background .2s; }
.timerbar.low .timerfill{ background:linear-gradient(90deg,var(--red),#D9685C); }

<body>
<div id="app">
  <div id="topbar">
    <button class="brandmark" aria-label="말문일본어 홈" onclick="goHome()">말<span>문</span></button>
    <div id="titlebox">
      <div class="eyebrow" id="eyebrow">하루면 말이 트이는</div>
      <h1 id="apptitle">말문일본어</h1>
    </div>
    <nav id="mainnav" aria-label="주 메뉴"><button data-nav="home" onclick="goHome()">학습하기</button><button data-nav="guide" onclick="openGuide()">조사 노트</button><button data-nav="phrases" onclick="openPhrases()">여행 회화</button></nav>
    <button class="iconbtn" id="voicebtn" aria-label="일본어 발음 켜기 또는 끄기" title="일본어 발음 듣기 (ja-JP)">🔊</button>
    <button class="iconbtn" id="homebtn" title="처음 화면으로" style="display:none;">🏠</button>
  </div>
  <div id="chlabel" style="display:none;"><span id="chlabeltxt"></span><button id="prevbtn">◂ 이전</button></div>
  <div id="progressline"><div id="progressbar" role="progressbar" aria-label="현재 코스 진행률" aria-valuemin="0" aria-valuemax="100"><div id="progressfill"></div></div></div>
  <main id="stage" tabindex="-1"></main>
  <footer><div class="footerbrand">말문일본어 <span>한글로 시작해, 나의 말이 되다.</span></div><details><summary>발음 듣기와 학습 안내</summary><p>한글 발음은 이해를 돕는 근사 표기입니다. 듣기로 실제 소리를 함께 익히세요. 일본어 음성이 없는 기기는 설정에서 일본어 TTS 음성을 추가해야 합니다. 학습 기록은 이 브라우저에 저장되며 다른 기기로 자동 동기화되지 않습니다. 첫 화면의 여행 이미지는 AI로 제작했습니다.</p></details><div class="footerlinks"><button onclick="goIntro()">말문일본어의 생각</button><button onclick="openSettings()">학습 설정</button><span>© 말문일본어</span></div></footer>

<script>
/* ═══════════ 코어: 상태 · 소리 · 라우터 · 학습 엔진 (오답 1회 허용 게이트) ═══════════ */
const $ = (s)=>document.querySelector(s);
function elN(h){ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild; }
const stage = $("#stage");

/* 저장: localStorage → sessionStorage → 메모리 폴백 */
const store = (()=>{
  let mem = {}, backend = null, mode = "memory";
  function ok(st){ try{ st.setItem("__t","1"); st.removeItem("__t"); return true; }catch(e){ return false; } }
  try{ if(typeof localStorage!=="undefined" && ok(localStorage)){ backend=localStorage; mode="local"; } }catch(e){}
  if(!backend){ try{ if(typeof sessionStorage!=="undefined" && ok(sessionStorage)){ backend=sessionStorage; mode="session"; } }catch(e){} }
  return {
    mode,
    get(){ try{ const raw = backend ? backend.getItem("malmun_v1") : mem.v; return JSON.parse(raw)||{}; }catch(e){ return {}; } },
    set(d){ const s=JSON.stringify(d); try{ if(backend) backend.setItem("malmun_v1", s); else mem.v=s; }catch(e){ mem.v=s; } },
  };
})();
const S = Object.assign({voice:true, done:{}, mode:"home", ch:null, step:0, miss:0}, store.get());
S.mode="home"; S.ch=null; S.step=0; S.miss=0;
if(!S.done || typeof S.done!=="object" || Array.isArray(S.done)) S.done={};
if(!Array.isArray(S.favorites)) S.favorites=[];
function save(){
  if(S.mode === "ch" && S.ch) S.resume={ch:S.ch,step:S.step,miss:S.miss};
  store.set({voice:S.voice,done:S.done,resume:S.resume,favorites:S.favorites||[]});
}

/* ── 효과음 ── */
let actx=null;
function tone(f,dur,delay=0,type="sine",vol=.1){
  try{
    if(typeof AudioContext==="undefined" && typeof webkitAudioContext==="undefined") return;
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended"){ try{ actx.resume(); }catch(e){} }
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime+delay;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const sfx = {
  tap:()=>tone(660,.07,0,"triangle",.07),
  good:()=>{tone(740,.12); tone(988,.18,.1);},
  bad:()=>tone(180,.26,0,"sawtooth",.08),
  coin:()=>{tone(1175,.09); tone(1568,.14,.07);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.22,i*.13));},
};
/* 발음 듣기: 한글 표기를 일본어 원문으로 바꿔 ja-JP 음성으로 읽는다 */
let _jaVoice=null, _voiceReady=false;
function pickJaVoice(){
  try{
    const vs=speechSynthesis.getVoices()||[];
    if(vs.length){
      _jaVoice = vs.find(v=>/ja[-_]?JP/i.test(v.lang))
              || vs.find(v=>/^ja/i.test(v.lang))
              || vs.find(v=>/japan/i.test(v.name||""))
              || null;
      _voiceReady=true;
    }
  }catch(e){}
}
if(typeof speechSynthesis!=="undefined"){
  pickJaVoice();
  try{ speechSynthesis.onvoiceschanged=pickJaVoice; }catch(e){}
}
/* 모바일(iOS/안드로이드): 첫 탭에서 오디오·음성 잠금 해제 */
let _audioUnlocked=false;
function unlockAudio(){
  if(_audioUnlocked) return; _audioUnlocked=true;
  try{
    actx = actx || ((window.AudioContext||window.webkitAudioContext) ? new (window.AudioContext||window.webkitAudioContext)() : null);
    if(actx && actx.state==="suspended") actx.resume();
  }catch(e){}
  try{
    if(typeof speechSynthesis!=="undefined"){
      pickJaVoice();
      // 무음 워밍업: iOS는 첫 발화를 제스처 안에서 한 번 깨워야 이후 자동 발화가 됨
      const warm=new SpeechSynthesisUtterance(" ");
      warm.volume=0; warm.lang="ja-JP"; if(_jaVoice) warm.voice=_jaVoice;
      speechSynthesis.speak(warm);
    }
  }catch(e){}
}
if(typeof document!=="undefined"){
  ["touchend","click","pointerdown"].forEach(ev=>{
    document.addEventListener(ev, unlockAudio, {once:false, passive:true});
  });
  // 첫 호출 후엔 리스너 부담 줄이기 위해 unlock 내부 가드로 처리됨
}
let _ttsWarned=false;
function speak(kr, opt){
  if(S.ch==="ch0") return; /* 0장은 한국어 구조 학습 — 일본어 발음 생략 */
  if(!S.voice || typeof speechSynthesis==="undefined") return;
  let text = (typeof toJP==="function") ? toJP(kr) : String(kr||"").replace(/<[^>]+>/g,"");
  /* 일본어만 발음: "= 뜻" 꼬리 + 이모티콘·한글·로마자 제거 (반말 설명 등에서 한글/이모지가 읽히지 않도록) */
  if(text){
    const sp = text.indexOf(" = "); if(sp>=0) text = text.slice(0,sp);
    text = Array.from(text).filter(function(ch){
      const c = ch.codePointAt(0);
      if(c===0x20) return true;                 // 공백
      if(c>=0x3000 && c<=0x30FF) return true;   // 일본어 구두점 + 히라가나 + 가타카나(ー포함)
      if(c>=0x3400 && c<=0x9FFF) return true;   // 한자
      if(c>=0xFF00 && c<=0xFFEF) return true;   // 전각 기호 + 반각 가타카나
      return false;                              // 한글 · 로마자 · 이모지 제거
    }).join("").trim();
  }
  if(!text) return;
  try{
    pickJaVoice(); /* 모바일 지연 로딩 대비: 매번 최신 목록 확인 */
    if(speechSynthesis.speaking || speechSynthesis.pending){ try{ speechSynthesis.cancel(); }catch(e){} }
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; u.pitch=1.0;
    u.rate = (opt&&opt.slow) ? 0.62 : 0.9;
    if(_jaVoice) u.voice=_jaVoice;  /* 일본어 음성이 있으면 지정, 없으면 lang만으로 OS 엔진에 위임 */
    speechSynthesis.speak(u);
    /* 음성팩이 정말 없을 때(목록은 찼는데 ja 없음) 1회 안내 */
    if(!_jaVoice && _voiceReady && !_ttsWarned){
      _ttsWarned=true;
      setTimeout(()=>{ try{
        if(typeof toast==="function") toast("이 기기에 일본어 음성이 없어 발음이 안 들릴 수 있어요. 설정 > 음성(TTS)에서 일본어를 추가하면 들립니다.");
        else console.warn("ja-JP voice not installed");
      }catch(e){} }, 50);
    }
  }catch(e){}
}
(function(){
  const b=$("#voicebtn"); if(!b) return;
  function paint(){ b.textContent = S.voice ? "🔊" : "🔇"; b.classList.toggle("on", S.voice); }
  paint();
  b.addEventListener("click",()=>{ S.voice=!S.voice; save(); paint();

})();

/* ── 라우터 ── */
function setHead(eb,h1){ $("#eyebrow").textContent=eb; $("#apptitle").textContent=h1; }
function chrome(mode){
  const inCh = mode==="ch";
  $("#homebtn").style.display = (mode==="home"||mode==="intro") ? "none" : "flex";
  $("#chlabel").style.display = inCh ? "flex" : "none";
  $("#progressline").style.display = inCh ? "block" : "none";
  window.scrollTo({top:0});
}
function goHome(){
  S.mode="home"; S.ch=null;
  setHead("하루면 말이 트이는","말문일본어");
  chrome("home"); renderHome();
}
$("#homebtn").onclick=()=>{ sfx.tap(); goHome(); };

/* ── 챕터 엔진 ── */
const CHS = {};
function startCh(id, step=0, resume=false){
  if(!CHS[id]) return goHome();
  const oldMiss=resume && S.resume ? Number(S.resume.miss)||0 : 0;
  S.mode="ch"; S.ch=id; S.step=Math.max(0,Math.min(Number(step)||0,CHS[id].steps.length-1)); S.miss=oldMiss;
  const ch=CHS[id];
  setHead(ch.eyebrow||"말문일본어", ch.title);
  chrome("ch"); renderStep();
}
function renderStep(){
  const ch=CHS[S.ch]; const steps=ch.steps;
  $("#chlabeltxt").textContent = `📍 ${ch.label||ch.title} · ${S.step+1} / ${steps.length}` + (S.miss?` · 실수 ${S.miss}`:"");
  $("#progressfill").style.width = Math.round(((S.step+1)/steps.length)*100)+"%";
  stage.innerHTML="";
  steps[S.step](stage);
  save();
  $("#prevbtn").textContent = S.step===0 ? "◂ 나가기" : "◂ 이전";
  window.scrollTo({top:0});
}
function next(){
  const ch=CHS[S.ch];
  if(S.step < ch.steps.length-1){ S.step++; renderStep(); }
  else{
    S.done[ch.id]=true; S.resume=null; S.mode="home"; save(); sfx.win();
    if(ch.onDone) ch.onDone(); else goHome();
  }
}
function prev(){ if(S.step>0){ S.step--; renderStep(); } else { const ch=CHS[S.ch]; (ch&&ch.back)?ch.back():goHome(); } }
$("#prevbtn").onclick=()=>{ sfx.tap(); prev(); };

/* ── 공용 빌더 ── */
function btnRow(label,tone,fn){
  const r=elN(`<div class="btnrow fade-up"><button class="btn ${tone||"primary"}">${label}</button></div>`);
  r.querySelector(".btn").onclick=()=>{ sfx.tap(); fn(); };
  return r;
}
function lesson({eyebrow,title,html,btn="다음 ▸",tone="primary",extra}){
  return (root)=>{
    root.appendChild(elN(`<div class="card fade-up">
      ${eyebrow?`<div class="eyebrow gold-t">${eyebrow}</div>`:""}
      ${title?`<div class="h">${title}</div>`:""}
      <div class="body">${html}</div></div>`));
    if(extra) extra(root);
    root.appendChild(btnRow(btn,tone,next));

}
/* 객관식 — 오답이면 정답을 바로 숙지시키고 진행, 실수 1회까지 챕터 통과 */
function mc({tag="퀴즈",q,opts,answer,why,tip}){
  return (root)=>{
    root.appendChild(elN(`<div class="card fade-up"><div class="eyebrow coral-t">✏️ ${tag}</div>
      <div class="h" style="font-size:15px;">${q}</div></div>`));
    const wrap=elN(`<div class="btnrow fade-up"></div>`);
    const fb=elN(`<div></div>`);
    const items = opts.map((o,i)=>({o, right:i===answer})).sort(()=>Math.random()-.5);
    items.forEach((it)=>{
      const b=document.createElement("button"); b.className="opt"; b.innerHTML=it.o;
      b._right=it.right;
      b.onclick=()=>{
        [...wrap.children].forEach(x=>x.style.pointerEvents="none");
        if(it.right){
          b.classList.add("right"); sfx.good(); speak(opts[answer]);
          fb.innerHTML=`<div class="feedback good">⭕ 정답! ${why}${tip?`<br/><span style="font-size:11.5px;color:#27503A;">💡 ${tip}</span>`:""}</div>
            <div class="btnrow" style="margin-top:10px;"><button class="btn primary">다음 ▸</button></div>`;
        }else{
          S.miss++; save(); b.classList.add("wrong","shake"); sfx.bad();
          [...wrap.children].find(x=>x._right).classList.add("right");
          fb.innerHTML=`<div class="feedback bad">🙅 아쉬워요! 정답은 <b>${opts[answer]}</b>예요.<br/>${why}${tip?`<br/><span style="font-size:11.5px;">💡 ${tip}</span>`:""}<br/><span style="font-size:11px;">한 번 더 입으로 읽고 넘어가요. (이번 코스 실수 ${S.miss}개 — 1개까지 통과!)</span></div>
            <div class="btnrow" style="margin-top:10px;"><button class="btn primary">숙지했어요, 다음 ▸</button></div>`;
        }
        $("#chlabeltxt").textContent=$("#chlabeltxt").textContent.replace(/( · 실수 \d+)?$/, S.miss?` · 실수 ${S.miss}`:"");
        fb.querySelector(".btn").onclick=()=>{ sfx.tap(); next(); };
      };
      wrap.appendChild(b);
    });
    root.appendChild(wrap); root.appendChild(fb);
  };
}
/* 형태 집중 드릴 — 흩어진 낱말 조각을 순서대로 조립, 실수 카운트 없음(학습 단계) */
function buildDrill({tag, formula, rounds, btn="공식 장착 완료 ▸", tone="coral"}){
  return (root)=>{
    const head=elN(`<div class="card fade-up"><div class="eyebrow coral-t">🧱 ${tag}</div>
      <div class="h" style="font-size:14.5px;">${formula}</div>
      <div class="body" id="dgoal"></div></div>`);
    const slot=elN(`<div class="slotline fade-up" id="dslot"></div>`);
    const mean=elN(`<div id="dmean" style="min-height:32px; padding:2px 6px; text-align:center; font-size:18px; font-weight:800; color:var(--ink);"></div>`);
    const pool=elN(`<div class="chips fade-up" id="dpool" style="padding:2px;"></div>`);
    const res=elN(`<div id="dres"></div>`);
    const ctrl=elN(`<div></div>`);
    let ri=0, picked=[], order=[];
    function fin(){
      head.querySelector("#dgoal").innerHTML=`<b>${rounds.length}연속 성공!</b> 같은 꼬리를 반복하니 공식이 보이죠?`;
      res.insertAdjacentHTML("beforeend", `<div class="feedback good pop-in" style="margin-top:8px;">🎉 공식이 손에 붙었어요!</div>`);
      ctrl.appendChild(btnRow(btn,tone,next));
    }
    function draw(){
      const r=rounds[ri];
      head.querySelector("#dgoal").innerHTML=`흩어진 조각을 눌러 만들어 보세요 (${ri+1}/${rounds.length}): <b>${r.ko}</b>`;
      slot.innerHTML=""; pool.innerHTML="";
      picked.forEach(p=>slot.appendChild(elN(`<span class="chip sel" style="cursor:default;">${p}</span>`)));
      if(picked.length===0){ order=[...r.parts, ...(r.extra||[])].sort(()=>Math.random()-.5); mean.innerHTML=""; }
      order.filter(p=>{ const used=picked.filter(x=>x===p).length, tot=r.parts.filter(x=>x===p).length; return used<tot; })
        .forEach(p=>{
          const c=elN(`<button class="chip">${p}</button>`);
          c.onclick=()=>{
            if(picked.length===0) res.innerHTML="";
            const need=r.parts[picked.length];
            if(p===need){
              sfx.coin(); picked.push(p);
              if(picked.length===1){ speak(r.parts[0]); }
              if(picked.length===1 && r.pm){
                const sp=r.pm.indexOf(" = ");
                mean.innerHTML = sp>0
                  ? `💡 <b style="color:var(--coral);">${r.pm.slice(0,sp)}</b> = ${r.pm.slice(sp+3)}`
                  : `💡 ${r.pm}`;
              }
              if(picked.length===r.parts.length){
                sfx.good(); speak(r.jp); pool.innerHTML="";
                const last=(ri===rounds.length-1);
                const noteHtml = r.note?`<br/><span style="font-size:11px;">${r.note}</span>`:"";
                const body = r.swap
                  ? `✨ <span class="drillword"><span class="rufly">${r.stem}</span> <span class="tailpop">${r.jp}</span></span><br/>기본형이 사라지고 → <span style="font-size:18px; font-weight:900;"><b>${r.jp}</b> = ${r.ko}</span>${noteHtml}`
                  : r.fly
                  ? `✨ <span class="drillword">${r.stem}<span class="rufly">루</span><span class="tailpop">${r.tail}</span></span><br/>루가 날아가고 → <span style="font-size:18px; font-weight:900;"><b>${r.jp}</b> = ${r.ko}</span>${noteHtml}`
                  : `✨ <span style="font-size:18px; font-weight:900;"><b>${r.jp}</b> = ${r.ko}</span>${noteHtml}`;
                res.innerHTML=`<div class="feedback good pop-in">${body}
                  <div class="btnrow" style="margin-top:10px;"><button class="btn ${last?"gold":"primary"} sm">${last?"마지막! 정리 ▸":"다음 단어 ▸"}</button></div></div>`;
                res.querySelector(".btn").onclick=()=>{ sfx.tap(); ri++; picked=[];
                  if(ri<rounds.length){ res.innerHTML=""; draw(); }
                  else { slot.innerHTML=""; fin(); } };
              } else draw();
            }else{
              sfx.bad(); c.classList.add("shake"); setTimeout(()=>{ try{c.classList.remove("shake");}catch(e){} },450);
              pool.innerHTML="";
              res.innerHTML=`<div class="feedback bad pop-in">❌ 틀렸어요! <b>${rounds.length}개 연속 정답</b>해야 통과 — 처음부터 다시!<div class="btnrow" style="margin-top:10px;"><button class="btn coral sm">처음부터 다시 ▸</button></div></div>`;
              res.querySelector(".btn").onclick=()=>{ sfx.tap(); ri=0; picked=[]; order=[]; res.innerHTML=""; slot.innerHTML=""; draw(); };
            }
          };
          pool.appendChild(c);
        });
    }
    draw();
    root.appendChild(head); root.appendChild(slot); root.appendChild(mean); root.appendChild(pool); root.appendChild(res); root.appendChild(ctrl);
  };
}
/* 한 조사 집중 드릴 — 정답은 항상 같은 조사 (주입식, 오답은 흔들리기만) */
function pickDrill({p, kr, items, decoys}){
  return (root)=>{
    const head=elN(`<div class="card fade-up"><div class="eyebrow coral-t">🧷 ${p} 집중 ×${items.length}</div>
      <div class="h" style="font-size:15px;">${p} = ${kr}</div>
      <div class="body" id="pgoal"></div></div>`);
    const pool=elN(`<div class="btnrow fade-up" id="pdpool"></div>`);
    const res=elN(`<div id="pdres"></div>`);
    const ctrl=elN(`<div></div>`);
    let i=0;
    function fin(){
      head.querySelector("#pgoal").innerHTML=`<b>${items.length}연속 성공!</b> 이제 ${p}는 자동으로 나옵니다.`;
      res.insertAdjacentHTML("beforeend", `<div class="feedback good pop-in" style="margin-top:8px;">🎉 ${p} 장착 완료!</div>`);
      ctrl.appendChild(btnRow("다음 ▸","coral",next));
    }
    function draw(){
      const it=items[i];
      head.querySelector("#pgoal").innerHTML=`(${i+1}/${items.length}) <b>${it.w}</b> + __ = "${it.ko}"`;
      pool.innerHTML="";
      [p, ...decoys].sort(()=>Math.random()-.5).forEach(c=>{
        const b=elN(`<button class="opt" style="padding:12px 8px;">${c}</button>`); b._right=(c===p);
        b.onclick=()=>{
          if(b._right){ sfx.coin(); speak(it.w.replace(/\(.*?\)/,"")+p); pool.innerHTML="";
            res.innerHTML=`<div class="feedback good pop-in">✨ <span style="font-size:18px; font-weight:900;"><b>${it.w.replace(/\(.*?\)/,"")}${p}</b> = ${it.ko}</span>
              <div class="btnrow" style="margin-top:10px;"><button class="btn primary sm">다음 ▸</button></div></div>`;
            res.querySelector(".btn").onclick=()=>{ sfx.tap(); i++; res.innerHTML="";
              if(i<items.length) draw(); else fin(); };
          }else{ sfx.bad(); b.classList.add("shake"); setTimeout(()=>{ try{b.classList.remove("shake");}catch(e){} },450); }
        };
        pool.appendChild(b);
      });
    }
    draw();
    root.appendChild(head); root.appendChild(pool); root.appendChild(res); root.appendChild(ctrl);
  };
}
/* 무오답 관문 — 랜덤 n문제, 하나라도 틀리면 처음부터 (코스 실수와 별개) */
function gauntlet({tag, bank, n=10, sec}){
  return (root)=>{
    const head=elN(`<div class="card fade-up" style="border-color:var(--red);"><div class="eyebrow coral-t">🔥 ${tag}</div>
      <div class="h" style="font-size:15px;">랜덤 ${n}문제 · ⏱️ 제한시간 — 틀리거나 늦으면 처음부터!</div>
      <div class="timerbar"><div class="timerfill"></div></div>
      <div class="body" id="ggoal"></div></div>`);
    const pool=elN(`<div class="btnrow fade-up" id="gpool"></div>`);
    const res=elN(`<div id="gres"></div>`);
    const ctrl=elN(`<div></div>`);
    const bar=head.querySelector(".timerbar"), fill=head.querySelector(".timerfill");
    let order=[], i=0, timer=null;
    function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
    function secsFor(it){ const base=(typeof sec==="number")?sec:7; const len=String(it&&it.q||"").replace(/<[^>]+>/g,"").length; return base + (len>34?3:0); }
    function startTimer(it){
      stopTimer();
      const total=secsFor(it); let left=total;
      if(fill) fill.style.width="100%"; if(bar) bar.classList.remove("low");
      timer=setInterval(()=>{
        if(!bar || !bar.isConnected){ stopTimer(); return; }   // 화면 이탈 시 자동 정리
        left-=0.1;
        const pct=Math.max(0,left/total*100);
        if(fill) fill.style.width=pct+"%";
        if(bar) bar.classList.toggle("low", pct<=33);
        if(left<=0){ stopTimer(); timeUp(); }
      },100);
    }
    function timeUp(){
      sfx.bad(); [...pool.children].forEach(x=>x.style.pointerEvents="none");
      res.innerHTML=`<div class="feedback bad pop-in">⏱️ 시간 초과! 무오답 관문 — 처음부터 다시!
        <div class="btnrow" style="margin-top:10px;"><button class="btn coral">처음부터 다시 ▸</button></div></div>`;
      res.querySelector(".btn").onclick=()=>{ sfx.tap(); reshuffle(); draw(); };
    }
    function reshuffle(){ order=[...bank].sort(()=>Math.random()-.5).slice(0,n); i=0; }
    function fin(){
      stopTimer(); if(fill) fill.style.width="100%"; if(bar) bar.classList.remove("low");
      head.querySelector("#ggoal").innerHTML=`<b>${n}연속 무오답!</b>`;
      pool.innerHTML="";
      res.innerHTML=`<div class="feedback good pop-in">🏆 퍼펙트! 완전히 몸에 붙었어요.</div>`;
      ctrl.appendChild(btnRow("관문 통과 ▸","gold",next));
    }
    function draw(){
      const it=order[i];
      head.querySelector("#ggoal").innerHTML=`(${i+1}/${n}) ${it.q}`;
      pool.innerHTML=""; res.innerHTML="";
      startTimer(it);
      [...it.opts].sort(()=>Math.random()-.5).forEach(c=>{
        const b=elN(`<button class="opt" style="padding:12px 8px;">${c}</button>`); b._right=(c===it.a);
        b.onclick=()=>{
          if(b._right){ stopTimer(); sfx.coin(); speak(it.say||(it.r&&it.r.split(" = ")[0])||it.a); pool.innerHTML="";
            res.innerHTML=`<div class="feedback good pop-in">✨ <span style="font-size:18px; font-weight:900;">${it.r}</span>
              <div class="btnrow" style="margin-top:10px;"><button class="btn primary sm">다음 ▸</button></div></div>`;
            res.querySelector(".btn").onclick=()=>{ sfx.tap(); i++;
              if(i<n) draw(); else fin(); };
          }else{
            stopTimer(); sfx.bad(); [...pool.children].forEach(x=>x.style.pointerEvents="none");
            res.innerHTML=`<div class="feedback bad">🙅 정답은 <b>${it.a}</b> — ${it.akr}. 무오답 관문 — 처음부터 다시!</div>
              <div class="btnrow" style="margin-top:10px;"><button class="btn coral">처음부터 다시 ▸</button></div>`;
            res.querySelector(".btn").onclick=()=>{ sfx.tap(); reshuffle(); draw(); };
          }
        };
        pool.appendChild(b);
      });
    }
    root.appendChild(head); root.appendChild(pool); root.appendChild(res); root.appendChild(ctrl);
    reshuffle(); draw();
  };
}

/* 문장 배열 — 챕터 마지막 종합용, 확인 1회 판정 */
function orderQ({tag="문장 배열",ko,words,answer,gloss}){
  return (root)=>{
    root.appendChild(elN(`<div class="card fade-up"><div class="eyebrow coral-t">🧩 ${tag}</div>
      <div class="h" style="font-size:15px;">한국어: ${ko}</div>
      <div class="body">배운 형태를 <b>문장</b>으로! 순서대로 눌러 완성 — 확인은 <b>한 번</b>만.</div></div>`));
    const slot=elN(`<div class="slotline fade-up"></div>`);
    const pool=elN(`<div class="chips fade-up" style="padding:2px;"></div>`);
    const ctrl=elN(`<div class="btnrow fade-up" style="margin-top:2px;"><button class="btn gold" id="okq">확인하기 ✓</button></div>`);
    const fb=elN(`<div></div>`);
    const shuffled=[...words].sort(()=>Math.random()-.5);
    let picked=[];
    function draw(){
      slot.innerHTML=""; pool.innerHTML="";
      picked.forEach((p,i)=>{ const c=elN(`<button class="chip sel">${p}</button>`);
        c.onclick=()=>{ sfx.tap(); picked.splice(i,1); draw(); }; slot.appendChild(c); });
      shuffled.filter(p=>!picked.includes(p)).forEach(p=>{ const c=elN(`<button class="chip">${p}</button>`);
        c.onclick=()=>{ sfx.tap(); picked.push(p); draw(); }; pool.appendChild(c); });
      ctrl.querySelector("#okq").disabled = picked.length!==answer.length;
    }
    draw();
    ctrl.querySelector("#okq").onclick=()=>{
      slot.style.pointerEvents="none"; pool.style.pointerEvents="none"; ctrl.style.display="none";
      if(picked.join("|")===answer.join("|")){
        sfx.good(); speak(answer.join(" "));
        fb.innerHTML=`<div class="feedback good">⭕ 완성! <b>${answer.join(" ")}</b><br/>${gloss}</div>
          <div class="btnrow" style="margin-top:10px;"><button class="btn primary">다음 ▸</button></div>`;
      }else{
        S.miss++; save(); sfx.bad(); slot.classList.add("shake");
        fb.innerHTML=`<div class="feedback bad">🙅 아쉬워요! 정답 순서는 <b>${answer.join(" ")}</b>예요.<br/>${gloss}<br/><span style="font-size:11px;">한 번 더 입으로 읽고 넘어가요. (이번 코스 실수 ${S.miss}개 — 1개까지 통과!)</span></div>
          <div class="btnrow" style="margin-top:10px;"><button class="btn primary">숙지했어요, 다음 ▸</button></div>`;

/* 한글 표기 문자열 → 일본어 원문 (없으면 그대로 반환). 끝의 ? 보존 */
function toJP(kr){
  if(kr==null) return "";
  let t = String(kr).replace(/<[^>]+>/g,"").trim();
  if(JP[t]) return JP[t];
  // 구두점(. , ? !)과 공백을 구분자로 토큰 분리 후 각 토큰을 변환·결합
  // 구두점은 일본어 문장부호로 살려 자연스러운 끊어읽기 유도
  if(/[\s.,!?。、]/.test(t)){
    const out=[];
    const re=/([^\s.,!?。、]+)|([.,!?。、]+)|(\s+)/g; let mm;
    while((mm=re.exec(t))!==null){
      if(mm[1]){ out.push(toJP(mm[1])); }              // 단어 토큰 → 재귀 변환
      else if(mm[2]){ out.push(/[?？]/.test(mm[2])?"？":(/[.。]/.test(mm[2])?"。":"、")); } // 구두점
      else { out.push(" "); }
    }
    return out.join("").replace(/\s+/g," ").trim();
  }
  // 데스카로 끝나는 미등록어 → "○○데스" + "か" 안전 분해
  if(t.length>3 && t.slice(-3)==="데스카"){
    const stem=t.slice(0,-3)+"데스";
    if(JP[stem]) return JP[stem]+"か";
  }
  // 카로 끝나는 미등록어 → 앞부분 사전 + か
  if(t.length>1 && t.slice(-1)==="카"){
    const stem=t.slice(0,-1);
    if(JP[stem]) return JP[stem]+"か";
  }
  // 동사 어미 합성 폴백: 한글 어미를 가나로 치환 (마지막 안전망)
  const TAIL=[["타이데스","たいです"],["테 구다사이","てください"],["마스카","ますか"],["마시타","ました"],["마센","ません"],["마쇼","ましょう"],["마스","ます"],["타라","たら"],["타이","たい"],["나이","ない"],["요우","よう"],["루?","る？"],["루","る"],["테","て"],["타","た"]];
  for(const [ko,ja] of TAIL){
    if(t.length>ko.length && t.slice(-ko.length)===ko){
      const stem=t.slice(0,-ko.length);
      if(JP[stem]) return JP[stem]+ja;          // stem이 사전에 있으면 결합
    }
  }
  return t;
}

function formRounds(e, extras, ex){
  const seq=[0,1,2,3,4];
  return seq.map((vi,i)=>{
    const v=VERBS[vi];
    const isQ=(e==="루?"), isKud=(e==="테 구다사이");
    const parts = isQ ? [v.base,"?"] : isKud ? [v.stem+"테","구다사이"] : [v.base, e];
    const jp = isKud ? v.stem+"테 구다사이" : jpForm(v,e);
    const last = (i===seq.length-1);
    return {ko:v.kr[e], parts, jp, stem:v.stem, tail:e, fly:(!isQ&&!isKud),
            pm: isKud ? `${v.stem}테 = ${v.kr["테"]}` : `${v.base} = ${v.mean}`,
            extra:(i>=3 && extras)?extras:undefined,
            note:(last&&ex)?`📝 예문: <b>${ex[0]}</b> = ${ex[1]}`:undefined};
  });
}

function simQ(stg, idx){
  const it = stg.items[idx];
  return (root)=>{
    root.appendChild(elN(`<div class="simhead fade-up"><span>${stg.icon} ${stg.title}</span><span>문제 ${idx+1} / ${stg.items.length}</span></div>`));
    root.appendChild(elN(`<div class="card fade-up"><div class="eyebrow gold-t">📍 상황</div><div class="body">${it.situ}</div></div>`));
    root.appendChild(elN(`<div class="dialog fade-up"><div class="portrait">${it.icon}</div>
      <div class="bubble"><div class="who">${it.who}</div><div class="txt">${it.line}</div></div></div>`));
    const wrap=elN(`<div class="btnrow fade-up"></div>`); const fb=elN(`<div></div>`);
    [...it.choices].sort(()=>Math.random()-.5).forEach(c=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=c; b._right=(c===it.a);
      b.onclick=()=>{
        [...wrap.children].forEach(x=>x.style.pointerEvents="none");
        if(b._right){
          b.classList.add("right"); sfx.good(); speak(it.a);
          fb.innerHTML=`<div class="feedback good">⭕ 좋아요! ${it.why}${it.tip?`<br/><span style="font-size:11.5px;">💡 ${it.tip}</span>`:""}</div>
            <div class="btnrow" style="margin-top:10px;"><button class="btn primary">다음 ▸</button></div>`;
        }else{
          S.miss++; save(); b.classList.add("wrong","shake"); sfx.bad();
          [...wrap.children].find(x=>x._right).classList.add("right");
          fb.innerHTML=`<div class="feedback bad">🙅 아쉬워요! <b>${c}</b>(은)는 "${MEAN[c]||"다른 뜻"}"이에요.<br/>정답은 <b>${it.a}</b> — ${it.why}${it.tip?`<br/><span style="font-size:11.5px;">💡 ${it.tip}</span>`:""}<br/><span style="font-size:11px;">한 번 더 입으로 읽고 넘어가요. (이번 스테이지 실수 ${S.miss}개 — 1개까지 통과!)</span></div>
            <div class="btnrow" style="margin-top:10px;"><button class="btn primary">숙지했어요, 다음 ▸</button></div>`;
        }
        $("#chlabeltxt").textContent=$("#chlabeltxt").textContent.replace(/( · 실수 \d+)?$/, S.miss?` · 실수 ${S.miss}`:"");
        fb.querySelector(".btn").onclick=()=>{ sfx.tap(); next(); };
      };
      wrap.appendChild(b);
    });
    root.appendChild(wrap); root.appendChild(fb);
  };
}

}

  {id:"ch3",  icon:"🎀", t:"3장 · 존댓말 공식", d:"데스=입니다 · 마스=습니다 — 형태 드릴 → 무오답 10"},
  {id:"chconj", icon:"🔗", t:"4장 · 이음말 (접속어)", d:"소시테·데모·소레데·다카라 — 데스 문장 빈칸 무오답 10"},
  {id:"chq",  icon:"❓", t:"5장 · 육하원칙 — 질문", d:"when~why + 데스카 합체 드릴 → 무오답 10"},
  {id:"chmid", icon:"🏔️", t:"6장 · 중간 종합 관문", d:"1~5장 총정리 — 랜덤 20문제, 틀리면 처음부터"},
  {id:"ch4",  icon:"🍜", t:"7장 · 식당 생존", d:"통째 인사 6개 + 상황 무오답 10 (배운 것 변별)"},
  {id:"sim",  icon:"🎮", t:"8장 · 식당 시뮬레이션", d:"4스테이지 — 단어 챙기고 입장: 라멘집·옆자리·이자카야·계산", open:openSimHub, dn:()=>["sim1","sim2","sim3","sim4"].every(k=>S.done[k])},
  {id:"ch9",  icon:"🌪️", t:"9장 · 심화 반말 (변신 동사)", d:"이쿠·노무·스루·쿠루 — 권유·희망·명령·과거 드릴 + 무오답 10"},

  {id:"chvoca", icon:"🚀", t:"배운 김에 더!", d:"자주 쓰는 형용사 + 데키마스·츠모리·데쇼 — 공식 3개 더"},

];
let resetArm=false;
function renderHome(){
  stage.innerHTML="";
  stage.appendChild(elN(`<div class="card fade-up" style="padding:12px 16px;">
    <div class="eyebrow gold-t">전체 여정 · 0~11장 + 시뮬 · 졸업 · 배운 김에 더</div>
    <div class="body" style="font-size:12.5px;">🧩 기초(0~1장) → 🗣️ 말 만들기(2~5장) → 🏔️ 종합·실전(6~8장) → 🌪️ 심화(9~11장) → 🎓 졸업 → 🚀 배운 김에 더.<br/><b>앞 장을 통과해야 다음 장이 열려요.</b> 위에서부터 차근차근, 각 장은 <b>틀리면 처음부터</b> 관문으로 마무리됩니다!</div></div>`));
  let prevCleared = true; // 0장은 항상 열림
  HOME_COURSES.forEach((c,idx)=>{
    const always = c.always === true;             // 잠금 예외(항상 열림)
    const done = c.dn ? c.dn() : !!S.done[c.id];
    const locked = !always && !done && !prevCleared;
    const mark = done ? "✅" : (locked ? "🔒" : "▸");
    const row=elN(`<div class="course fade-up${locked?" locked":""}"><div class="ic">${c.icon}</div>
      <div style="flex:1;"><div class="t">${c.t}</div><div class="d">${locked?"앞 장을 완료하면 열려요":c.d}</div></div>
      <div class="done">${mark}</div></div>`);
    if(locked){
      row.onclick=()=>{ sfx.bad(); row.classList.add("shake"); setTimeout(()=>{ try{row.classList.remove("shake");}catch(e){} },450); };
    }else{
      row.onclick=()=>{ sfx.tap(); resetArm=false; c.open ? c.open() : startCh(c.id); };
    }
    stage.appendChild(row);
    if(!always) prevCleared = done; // 잠금예외 항목은 흐름에 영향 안 줌
  });
  stage.appendChild(elN(`<div class="caption" style="text-align:center;">🔒 잠긴 장은 앞 장을 통과하면 열려요 · 완료한 장은 ✅로 저장돼 다시 안 해도 됩니다</div>`));
  if(store.mode!=="local"){
    stage.appendChild(elN(`<div class="caption" style="text-align:center; color:var(--red);">⚠️ 이 환경(미리보기 등)에서는 진행이 영구 저장되지 않을 수 있어요.<br/>파일을 Safari·Chrome 브라우저로 직접 열면 자동 저장됩니다.</div>`));
  }
  stage.appendChild(btnRow("🍼 이 앱의 원리 다시 보기","ghost",goIntro));
  const rb=btnRow(resetArm?"⚠️ 한 번 더 누르면 모든 ✅가 사라져요":"🗑️ 진행 초기화","ghost",()=>{
    if(!resetArm){ resetArm=true; renderHome(); }
    else{ resetArm=false; S.done={}; save(); sfx.bad(); renderHome(); }
  });
  if(resetArm) rb.querySelector(".btn").style.color="var(--red)";
  stage.appendChild(rb);
}
// The refreshed dashboard starts after the supplemental lessons load.
</script>
